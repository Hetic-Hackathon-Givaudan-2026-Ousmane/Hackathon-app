openapi: 3.1.0
info:
  title: Hackathon App API
  description: API du prototype Passerelle et de ses fiches de tendance.
  version: 0.1.0
servers:
  - url: http://localhost:3000
    description: API du dev container
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Vérifier l'API et sa connexion à PostgreSQL
      responses:
        '200':
          description: API accessible et base de données connectée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/questions:
    get:
      operationId: listQuestions
      summary: Lister les dix questions les plus récentes
      responses:
        '200':
          description: Questions triées de la plus récente à la plus ancienne.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/Question'
    post:
      operationId: createQuestion
      summary: Poser une question à l'IA et enregistrer sa réponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - question
              properties:
                question:
                  type: string
                  minLength: 1
                  description: Texte de la question ; les espaces de début et fin sont retirés.
      responses:
        '201':
          description: Question et réponse enregistrées.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Question'
        '400':
          description: Question absente ou vide après suppression des espaces.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Erreur interne, de base de données ou du fournisseur IA.
  /api/verdict:
    post:
      operationId: createTrendVerdict
      summary: Générer une proposition de suivi pour une tendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrendRequest'
      responses:
        '200':
          description: Verdict généré ou réponse de secours explicitement signalée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendVerdict'
        '404':
          description: Identifiant de tendance inconnu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendError'
  /api/brief:
    post:
      operationId: createTrendBrief
      summary: Générer un brief pour une tendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrendRequest'
      responses:
        '200':
          description: Brief généré ou réponse de secours explicitement signalée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendBrief'
        '404':
          description: Identifiant de tendance inconnu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendError'
  /api/journal:
    get:
      operationId: getJournal
      summary: Lire les décisions et les statuts de sources enregistrés
      responses:
        '200':
          description: État du journal de l'analyste, par identifiant de tendance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journal'
  /api/journal/decisions/{id}:
    put:
      operationId: setJournalDecision
      summary: Enregistrer la décision de l'analyste pour une tendance
      parameters:
        - $ref: '#/components/parameters/TrendId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verdict]
              properties:
                verdict:
                  type: string
                  enum: [Suivre, Observer, Ignorer]
      responses:
        '200':
          description: Décision enregistrée, remplaçant la précédente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalDecision'
        '400':
          description: Décision invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendError'
        '404':
          description: Identifiant de tendance inconnu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendError'
  /api/journal/sources/{id}/{index}:
    put:
      operationId: setJournalSourceStatus
      summary: Enregistrer le statut de vérification d'une source
      parameters:
        - $ref: '#/components/parameters/TrendId'
        - name: index
          in: path
          required: true
          description: Position de la source dans la fiche, à partir de 0.
          schema:
            type: integer
            minimum: 0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: [string, 'null']
                  enum: [verifiee, a-confirmer, null]
                  description: '`null` retire le statut.'
      responses:
        '200':
          description: Statut enregistré.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: [string, 'null']
                    enum: [verifiee, a-confirmer, null]
        '400':
          description: Statut invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendError'
        '404':
          description: Tendance ou source inconnue.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendError'
components:
  parameters:
    TrendId:
      name: id
      in: path
      required: true
      description: Identifiant d'une fiche Passerelle.
      schema:
        type: string
  schemas:
    Journal:
      type: object
      required: [decisions, sources]
      properties:
        decisions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JournalDecision'
        sources:
          type: object
          description: Statuts par tendance, dans l'ordre des sources de la fiche.
          additionalProperties:
            type: array
            items:
              type: [string, 'null']
              enum: [verifiee, a-confirmer, null]
    JournalDecision:
      type: object
      required: [verdict, at]
      properties:
        verdict:
          type: string
          enum: [Suivre, Observer, Ignorer]
        at:
          type: string
          format: date-time
    Health:
      type: object
      required:
        - status
        - db
      properties:
        status:
          type: string
          const: ok
        db:
          type: string
          description: Version renvoyée par PostgreSQL.
    Question:
      type: object
      required:
        - id
        - question
        - answer
        - created_at
      properties:
        id:
          type: integer
        question:
          type: string
        answer:
          type: string
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    TrendRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: Identifiant d'une fiche Passerelle.
    TrendVerdict:
      type: object
      required:
        - verdict
        - justification
        - limites
        - source
      properties:
        verdict:
          type: string
          enum: [Suivre, Observer, Ignorer]
        justification:
          type: string
        limites:
          type: string
        source:
          type: string
          enum: [ia, secours]
        model:
          type: string
    TrendBrief:
      type: object
      required:
        - brief
        - source
      properties:
        brief:
          type: object
          required: [pourquoi, fenetre, reserve]
          properties:
            pourquoi:
              type: string
            fenetre:
              type: string
            reserve:
              type: string
        source:
          type: string
          enum: [ia, secours]
        model:
          type: string
    TrendError:
      type: object
      required:
        - erreur
      properties:
        erreur:
          type: string
